<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-labelledby="title description">
  <title id="title">dajinglingpake developer profile</title>
  <desc id="description">Animated profile banner for AI tooling, developer workflow and backend systems</desc>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" />
      <stop offset="0.52" stop-color="#8250df" />
      <stop offset="1" stop-color="#1a7f37" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0" />
      <stop offset="0.5" stop-color="#54aeff" />
      <stop offset="1" stop-color="#0969da" stop-opacity="0" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" class="grid-line" />
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .surface { fill: #f6f8fa; }
    .border { stroke: #d0d7de; }
    .grid-line { stroke: #0969da; stroke-opacity: 0.07; }
    .primary { fill: #1f2328; }
    .cta { fill: #0969da; }
    .beam { animation: beam 5s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(2, end) infinite; }
    .signal { animation: signal 2.4s ease-in-out infinite; }
    .signal-delay { animation-delay: 0.8s; }

    @keyframes beam {
      0%, 100% { transform: translateX(-200px); opacity: 0; }
      15%, 85% { opacity: 0.8; }
      50% { transform: translateX(760px); opacity: 0.8; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes signal {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1); }
    }

    @media (prefers-color-scheme: dark) {
      .surface { fill: #0d1117; }
      .border { stroke: #30363d; }
      .grid-line { stroke: #58a6ff; stroke-opacity: 0.07; }
      .primary { fill: #f0f6fc; }
      .cta { fill: #58a6ff; }
    }

    @media (prefers-reduced-motion: reduce) {
      .beam, .cursor, .signal { animation: none; }
    }
  </style>

  <rect class="surface" x="1" y="1" width="758" height="198" rx="14" />
  <rect x="1" y="1" width="758" height="198" rx="14" fill="url(#grid)" />
  <rect class="border" x="1" y="1" width="758" height="198" rx="14" fill="none" />
  <rect x="1" y="1" width="5" height="198" rx="2.5" fill="url(#accent)" />
  <rect class="beam" x="0" y="1" width="180" height="2" fill="url(#beam)" />

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="40" y="87" fill="url(#accent)" font-size="40" font-weight="700" letter-spacing="0.4">dajinglingpake</text>
    <rect class="cursor" x="387" y="56" width="4" height="36" rx="2" fill="#2da44e" />
    <text class="primary" x="42" y="126" font-size="17" font-weight="500">AI tooling · developer workflow · backend systems</text>
    <text class="cta" x="42" y="157" font-size="14" font-weight="600">VIEW REPOSITORIES  -&gt;</text>
  </g>

  <g fill="none" stroke="#54aeff" stroke-width="1.4" stroke-opacity="0.55">
    <path d="M 586 63 L 650 39 L 716 72 L 656 133 L 580 111 Z" />
    <path d="M 586 63 L 656 133 M 650 39 L 580 111 M 716 72 L 586 63" />
  </g>
  <g fill="#0969da" filter="url(#glow)">
    <circle class="signal" cx="586" cy="63" r="4.5" transform-origin="586px 63px" />
    <circle class="signal signal-delay" cx="650" cy="39" r="3.5" transform-origin="650px 39px" />
    <circle cx="716" cy="72" r="4.5" />
    <circle class="signal signal-delay" cx="656" cy="133" r="4.5" transform-origin="656px 133px" />
    <circle class="signal" cx="580" cy="111" r="3.5" transform-origin="580px 111px" />
  </g>
</svg>
